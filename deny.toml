# cargo-deny config (workflow .github/workflows/cargo-deny.yml).
# Ignores mirror osv-scanner.toml (reviewed by 2026-12-28); only RUSTSEC IDs apply here.

[advisories]
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2021-0145", reason = "atty 0.2.14, pulled in only by rustpython-vm 0.4.0 (Python sandbox; no newer RustPython on crates.io). Unmaintained; the unaligned-read report concerns atty's Windows console check (stream-type query on stdio handles), which takes no untrusted input." },
    { id = "RUSTSEC-2024-0375", reason = "atty 0.2.14, pulled in only by rustpython-vm 0.4.0 (Python sandbox; no newer RustPython on crates.io). Unmaintained; the unaligned-read report concerns atty's Windows console check (stream-type query on stdio handles), which takes no untrusted input." },
    { id = "RUSTSEC-2026-0105", reason = "core2 0.4.0 (unmaintained, all versions yanked), via fastembed -> image -> ravif -> rav1e -> bitstream-io. Not fixable without moving fastembed 4 -> 7 (separate migration). Already locked, so builds are unaffected by the yank." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash 0.2.1 (unmaintained), via tauri-utils -> kuchikiki -> selectors. Unmaintained hasher, no vulnerability; waiting on tauri to replace kuchikiki." },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 (unsound VariantStrIter), Linux-only via tauri's gtk3 backend (muda -> gtk). Fix needs glib 0.20 which needs a gtk4-based tauri. We do not call glib Variant iterators; shipped targets are Windows and macOS." },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5, via lancedb -> lance -> tantivy 0.24 (our own direct lru is already 0.18). Fix needs a newer tantivy, i.e. lancedb 0.23 -> 0.39 (arrow 56 pin), a separate migration. Unsoundness in IterMut / panic safety of pop(), not reachable from untrusted input." },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.12.5, via lancedb -> lance -> tantivy 0.24 (our own direct lru is already 0.18). Fix needs a newer tantivy, i.e. lancedb 0.23 -> 0.39 (arrow 56 pin), a separate migration. Unsoundness in IterMut / panic safety of pop(), not reachable from untrusted input." },
    { id = "RUSTSEC-2026-0186", reason = "memmap2 0.5.10, via rustpython-stdlib (mmap module). The sandbox import allowlist (ALLOWED_MODULES in python-sandbox/src/sandbox.rs) does not include mmap, so model-written Python cannot reach it." },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix 0.4.0 (unmaintained), via fastembed -> hf-hub -> indicatif 0.17. Only used for progress-bar byte formatting; goes away with the fastembed 4 -> 7 migration." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 (unmaintained proc-macro), via datafusion (lancedb) and other crates. Proc-macro, so compile-time only; no runtime code." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 (unmaintained proc-macro), via glib-macros (Linux gtk3 backend). Compile-time only." },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7.3, build-dependency only (phf_codegen -> selectors -> kuchikiki -> tauri-utils). Not compiled into the shipped binary; the issue needs a custom logger calling rand at runtime." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 (unmaintained), via lopdf 0.42. Accepted trade: lopdf 0.42 fixes the stack overflow RUSTSEC-2026-0187 on untrusted PDFs, which is worse than an unmaintained font parser." },
    { id = "RUSTSEC-2025-0075", reason = "unic-* 0.9 family (unmaintained), via rustpython-parser / rustpython-stdlib (Python sandbox and pre-exec syntax validation). No replacement released by RustPython 0.4; pure Unicode tables with no I/O." },
