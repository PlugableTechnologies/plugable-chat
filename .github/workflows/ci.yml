name: CI
# Build and unit-test on every push and pull request. Needs no secrets and never
# touches the GPU box. On main it also keeps the unsigned Windows installer and
# the compiled GPU tests as artifacts, which gpu-validate.yml downloads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ethnum 1.5.2 (via lancedb > lance > jsonb) fails to compile on the newest stable
# Rust ("cannot transmute between types of different sizes"). 1.94.1 is what
# builds locally. RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's "stable".
# Remove the pin once the lance/jsonb dependency chain moves to a fixed ethnum.
env:
  RUSTUP_TOOLCHAIN: "1.94.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install JavaScript dependencies (locked)
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

  build-windows:
    name: Build and unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install JavaScript dependencies (locked)
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Compile the tests for the GPU box
        shell: pwsh
        run: pwsh scripts/ci/collect-test-binaries.ps1 -Out gpu-tests

      - name: Build the unsigned installer
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis

      - name: Collect the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Get-ChildItem target/release/bundle/nsis -Filter *.exe | Copy-Item -Destination installer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned-${{ github.sha }}
          path: installer/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-tests-${{ github.sha }}
          path: gpu-tests/*
          if-no-files-found: error
