name: CI
# Build and unit-test on every push and pull request. Needs no secrets and never
# touches the GPU box. On main it also keeps the unsigned Windows installer and
# the compiled GPU tests as artifacts, which gpu-validate.yml downloads.
on:
  push:
    branches: [main]
    # Documentation and infrastructure-script changes cannot affect the build.
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ethnum 1.5.2 (via lancedb > lance > jsonb) fails to compile on the newest stable
# Rust ("cannot transmute between types of different sizes"). 1.94.1 is what
# builds locally. RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's "stable".
# Remove the pin once the lance/jsonb dependency chain moves to a fixed ethnum.
env:
  RUSTUP_TOOLCHAIN: "1.94.1"

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a run on main: a cold Windows build takes
  # ~19 minutes and its artifacts are what the GPU box tests.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev protobuf-compiler libprotobuf-dev libgtk-3-dev

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install JavaScript dependencies (locked)
        run: npm ci

      - name: Check the tauri crate and npm package versions match
        run: |
          node --test scripts/ci/check-tauri-versions.test.mjs
          node scripts/ci/check-tauri-versions.mjs

      - name: Type-check and build the frontend
        run: npm run build

      - name: Signing script tests (no Windows or DigiCert needed)
        run: node --test scripts/sign-windows.test.mjs

      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

  build-windows:
    name: Build and unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Install protoc (pinned, hash-checked)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v30.2/protoc-30.2-win64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "10f35df7722a69dde8ee92b4a16a4e1cc91cfce82fbb4a371bd046de139aa4a9") { throw "protoc hash mismatch: $hash" }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP "protoc")
          "PROTOC=$(Join-Path $env:RUNNER_TEMP 'protoc\bin\protoc.exe')" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install JavaScript dependencies (locked)
        run: npm ci

      - name: Check the tauri crate and npm package versions match
        run: |
          node --test scripts/ci/check-tauri-versions.test.mjs
          node scripts/ci/check-tauri-versions.mjs

      - name: Type-check and build the frontend
        run: npm run build

      - name: Compile the tests, and place the ONNX Runtime DLLs beside them
        shell: pwsh
        run: pwsh scripts/ci/collect-test-binaries.ps1 -Out gpu-tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gpu-tests-${{ github.sha }}
          path: gpu-tests/*
          if-no-files-found: warn

      - name: Diagnose test start-up (which import is missing)
        if: always()
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/debug/deps -Filter "plugable_chat_lib-*.exe" | Sort-Object LastWriteTime | Select-Object -Last 1
          pwsh scripts/ci/check-imports.ps1 -Exe $exe.FullName

      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      # --debug on purpose: the workspace's release profile (fat LTO, one codegen unit,
      # lancedb + datafusion) ran for 77 minutes without finishing on a hosted runner.
      # A debug-profile installer builds from the cache in minutes and exercises the same
      # code and native libraries, which is what the GPU box needs to validate. The
      # optimized build is release.yml's job.
      - name: Build the unsigned installer (debug profile)
        run: node node_modules/@tauri-apps/cli/tauri.js build --debug --bundles nsis,msi

      - name: Collect the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Get-ChildItem target/debug/bundle -Include *.exe, *.msi -Recurse -File | Copy-Item -Destination installer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned-${{ github.sha }}
          path: installer/*
          if-no-files-found: error
