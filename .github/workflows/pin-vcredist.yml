name: Pin VC++ redistributable
# Manual, read-only helper: downloads Microsoft's VC++ 2015-2022 x64 Redistributable on a Windows
# runner, checks it is validly Authenticode-signed by Microsoft (scripts/ci/fetch-vcredist.ps1
# -UpdatePin) and uploads the resulting scripts/ci/vcredist.pin.json as an artifact. Nothing is
# committed from here; a person downloads the artifact, reviews it and commits it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download, verify the Microsoft signature, record the hash
        shell: pwsh
        run: |
          pwsh scripts/ci/fetch-vcredist.ps1 -UpdatePin
          Get-Content scripts/ci/vcredist.pin.json -Raw >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vcredist-pin
          path: scripts/ci/vcredist.pin.json
          if-no-files-found: error
