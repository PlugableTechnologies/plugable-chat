name: Signing smoke test
# Proves the DigiCert KeyLocker signing path works before any product release depends on it.
# Builds an .exe, a .dll and an .msi, signs each with the SAME script the release uses
# (scripts/sign-windows.mjs), and verifies them with the release's verifier. Runs both signing
# routes so the release can use whichever one actually works on a GitHub-hosted runner:
#   simple   - smctl --simple: no signtool, no DigiCert KSP driver
#   signtool - smctl drives signtool through the DigiCert KSP (needs the full action setup)
# Manual only; runs in the same protected Environment as releases, so it needs the same
# reviewer approval and can read the same credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: smoke-test (${{ matrix.route }} route)
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        route: [simple, signtool]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build test files (exe, dll, msi)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Set-Content -Path smoke/hello.rs -Value 'fn main() { println!("plugable signing smoke test"); }'
          rustc smoke/hello.rs -o smoke/hello.exe
          Set-Content -Path smoke/lib.rs -Value '#[no_mangle] pub extern "C" fn plugable_smoke() -> i32 { 42 }'
          rustc --crate-type cdylib smoke/lib.rs -o smoke/hello.dll

          # A minimal but valid MSI, made with Windows Installer COM automation. It must run in
          # Windows PowerShell 5.1 (powershell.exe); tested on a real Windows box before use here.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/make-test-msi.ps1 -Path smoke/hello.msi
          if ($LASTEXITCODE -ne 0) { throw "could not create the test MSI" }
          Get-ChildItem smoke | Format-Table Name, Length

      - name: Write the KeyLocker client certificate
        shell: pwsh
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "keylocker-client.p12"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
          "SM_CLIENT_CERT_FILE=$path" >> $env:GITHUB_ENV

      - name: Install DigiCert signing tools (smctl)
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        with:
          simple-signing-mode: ${{ matrix.route == 'simple' }}
          use-github-caching-service: false

      # The signtool route needs signtool.exe on PATH and DigiCert's KSP driver registered with
      # the certificate synced into the Windows store. Simple mode sets up none of that.
      - name: Prepare signtool and the DigiCert KSP
        if: matrix.route == 'signtool'
        shell: pwsh
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\signtool.exe" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          $signtool.DirectoryName >> $env:GITHUB_PATH
          $env:PATH = "$($signtool.DirectoryName);$env:PATH"
          Write-Host "signtool: $($signtool.FullName)"
          $registrar = Get-Command smksp_registrar.exe -ErrorAction SilentlyContinue
          if ($registrar) {
            smksp_registrar.exe register
            smksp_registrar.exe list
          } else {
            Write-Host "smksp_registrar.exe is not on PATH; the KSP may not be installed by this action mode"
          }
          smctl windows certsync
          smctl healthcheck

      - name: Sign the test files (same script as the release)
        shell: pwsh
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
          SIGN_ROUTE: ${{ matrix.route }}
        run: node scripts/sign-windows.mjs smoke/hello.exe smoke/hello.dll smoke/hello.msi

      - name: Remove the client certificate from the runner
        if: always()
        shell: pwsh
        run: |
          if ($env:SM_CLIENT_CERT_FILE -and (Test-Path $env:SM_CLIENT_CERT_FILE)) {
            Remove-Item -Force $env:SM_CLIENT_CERT_FILE
          }

      - name: Verify the signatures
        shell: pwsh
        run: pwsh scripts/verify-windows-signatures.ps1 -Path smoke/hello.exe, smoke/hello.dll, smoke/hello.msi
