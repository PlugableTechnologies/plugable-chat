[[IgnoredVulns]]
id = "RUSTSEC-2026-0186"
ignoreUntil = 2026-12-28
reason = "memmap2 0.5.10, via rustpython-stdlib (mmap module). The sandbox import allowlist (ALLOWED_MODULES in python-sandbox/src/sandbox.rs) does not include mmap, so model-written Python cannot reach it."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0119"
ignoreUntil = 2026-12-28
reason = "number_prefix 0.4.0 (unmaintained), via fastembed -> hf-hub -> indicatif 0.17. Only used for progress-bar byte formatting; goes away with the fastembed 4 -> 7 migration."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2026-12-28
reason = "paste 1.0.15 (unmaintained proc-macro), via datafusion (lancedb) and other crates. Proc-macro, so compile-time only; no runtime code."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2026-12-28
reason = "proc-macro-error 1.0.4 (unmaintained proc-macro), via glib-macros (Linux gtk3 backend). Compile-time only."

[[IgnoredVulns]]
