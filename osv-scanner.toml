ignoreUntil = 2026-12-28
reason = "thrift 0.17.0, via parquet 56 -> datafusion -> lance. Fix is 0.23; parquet 56 pins the old version, so this needs the lancedb migration. Only used to read Parquet metadata in our local Lance data."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = 2026-12-28
reason = "ttf-parser 0.25.1 (unmaintained), via lopdf 0.42. Accepted trade: lopdf 0.42 fixes the stack overflow RUSTSEC-2026-0187 on untrusted PDFs, which is worse than an unmaintained font parser."

