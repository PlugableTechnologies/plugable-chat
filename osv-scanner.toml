[[IgnoredVulns]]
id = "RUSTSEC-2026-0002"
ignoreUntil = 2026-12-28
reason = "lru 0.12.5, via lancedb -> lance -> tantivy 0.24 (our own direct lru is already 0.18). Fix needs a newer tantivy, i.e. lancedb 0.23 -> 0.39 (arrow 56 pin), a separate migration. Unsoundness in IterMut / panic safety of pop(), not reachable from untrusted input."

