[[IgnoredVulns]]
id = "RUSTSEC-2026-0105"
ignoreUntil = 2026-12-28
reason = "core2 0.4.0 (unmaintained, all versions yanked), via fastembed -> image -> ravif -> rav1e -> bitstream-io. Not fixable without moving fastembed 4 -> 7 (separate migration). Already locked, so builds are unaffected by the yank."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0057"
ignoreUntil = 2026-12-28
reason = "fxhash 0.2.1 (unmaintained), via tauri-utils -> kuchikiki -> selectors. Unmaintained hasher, no vulnerability; waiting on tauri to replace kuchikiki."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-12-28
reason = "glib 0.18.5 (unsound VariantStrIter), Linux-only via tauri's gtk3 backend (muda -> gtk). Fix needs glib 0.20 which needs a gtk4-based tauri. We do not call glib Variant iterators; shipped targets are Windows and macOS."

