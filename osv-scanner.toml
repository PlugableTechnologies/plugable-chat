# Known-and-accepted advisories. Every entry has a reason and expires on 2026-12-28, so it gets re-reviewed.
# Keep this list in sync with deny.toml (cargo-deny); both scanners must ignore the same IDs.
# The IDs are listed both as RUSTSEC and GHSA aliases where OSV reports both.

[[IgnoredVulns]]
id = "RUSTSEC-2021-0145"
ignoreUntil = 2026-12-28
reason = "atty 0.2.14, pulled in only by rustpython-vm 0.4.0 (Python sandbox; no newer RustPython on crates.io). Unmaintained; the unaligned-read report concerns atty's Windows console check (stream-type query on stdio handles), which takes no untrusted input."

